name: Deploy a InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy_to_infinityfree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Aviso de inicio
        run: echo "Iniciando deploy a InfinityFree..."

      - name: Sincronizar archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./
          server-dir: /htdocs/proyectoWeb/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config/config.ini
